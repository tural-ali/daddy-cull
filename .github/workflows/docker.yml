name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Server install (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build, start, file a photo, check the web container
        run: examples/test-compose.sh
